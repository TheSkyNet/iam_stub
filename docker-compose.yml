networks:
    phalcons:
        driver: bridge
volumes:
    phalcons-mysql:
        driver: local
    phalcons-redis:
        driver: local
    ollama-data:
        driver: local
services:
    laravel.test:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                PHALCON_VERSION: '5.23.0'
        image: phalcons-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${WS_PORT:-8081}:8081'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - phalcons
        healthcheck:
            test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 80); exit($$s ? 0 : 1);"]
            interval: 5s
            timeout: 2s
            retries: 10
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
    mysql:
        image: 'mysql:8.4.11'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_NAME:-${DB_DATABASE:-phalcons}}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'phalcons-mysql:/var/lib/mysql'
        networks:
            - phalcons
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --password=$${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s
    redis:
        image: 'redis:8.10.2-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'phalcons-redis:/data'
        networks:
            - phalcons
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:v1.32.0'
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            phalcons:
                aliases:
                    - mailhog
    nginx:
        image: 'nginx:1.30.6-alpine'
        ports:
            - '${FORWARD_NGINX_PORT:-8085}:80'
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        networks:
            - phalcons
        depends_on:
            laravel.test:
                condition: service_healthy
